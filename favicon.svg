<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- 배경 어두운 남색 그라데이션 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- 뒤쪽 보라색 카드 그라데이션 -->
        <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>

        <!-- 앞쪽 하늘색 카드 그라데이션 -->
        <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <!-- 말풍선 오렌지-핑크 그라데이션 -->
        <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>

        <!-- 입체감 그림자 필터 -->
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- 테두리가 둥근 사각형 배경 (Squircle) -->
    <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" stroke="#312e81" stroke-width="6" />

    <g filter="url(#dropShadow)" transform="translate(10, 5)">
        <!-- 1. 맨 뒤 보라색 카드 (살짝 회전) -->
        <rect x="150" y="145" width="180" height="230" rx="28" fill="url(#backCardGrad)" transform="rotate(-8 240 260)" />

        <!-- 2. 중간 하늘색 카드 (게시물 본체) -->
        <g transform="rotate(-4 220 250)">
            <rect x="130" y="130" width="180" height="230" rx="28" fill="url(#frontCardGrad)" stroke="#083344" stroke-width="4" />
            <!-- 가상의 텍스트 줄 (게시판 느낌) -->
            <rect x="165" y="165" width="110" height="14" rx="7" fill="#ffffff" opacity="0.9" />
            <rect x="165" y="195" width="110" height="12" rx="6" fill="#ffffff" opacity="0.8" />
            <rect x="165" y="222" width="80" height="12" rx="6" fill="#ffffff" opacity="0.8" />
        </g>

        <!-- 3. 앞쪽 말풍선 (소통 & 댓글) -->
        <g transform="translate(210, 195)">
            <!-- 어두운 테두리 효과를 위한 그림자/외곽선 패스 -->
            <path d="M25 0h110c13.8 0 25 11.2 25 25v60c0 13.8-11.2 25-25 25H68.7L32 135c-4.4 3.5-11 0.4-11-5.3V110C9.4 110 0 98.8 0 85V25C0 11.2 9.4 0 25 0z" fill="#1e1b4b" opacity="0.3" transform="translate(0, 4)" />

            <!-- 말풍선 본체 -->
            <path d="M25 0h110c13.8 0 25 11.2 25 25v60c0 13.8-11.2 25-25 25H68.7L32 135c-4.4 3.5-11 0.4-11-5.3V110C9.4 110 0 98.8 0 85V25C0 11.2 9.4 0 25 0z" fill="url(#bubbleGrad)" stroke="#581c87" stroke-width="4" />

            <!-- 내부 연필 아이콘 (작성/자유게시판 상징) -->
            <g transform="translate(68, 42) rotate(45)" fill="#ffffff">
                <path d="M0 0h6v18H0z" />
                <path d="M0 18l3 5 3-5H0z" />
                <rect x="-1" y="-4" width="8" height="4" rx="1" />
            </g>
        </g>
    </g>
</svg>
